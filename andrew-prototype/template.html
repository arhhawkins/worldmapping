<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worldmapping prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ebd8; --land:#ece2c9; --sea:#d3dfe1; --water:#a9bfc6; --border:#6f5f4c;
  --ink:#3a3026; --ink-soft:#6d604f; --panel:rgba(247,241,226,.94); --rule:#c9b99c;
  --accent:#8c3b2e; --label:#3a3026; --halo:rgba(243,235,216,.85);
  --c0:#e7b6ae; --c1:#efd59c; --c2:#c3d6a8; --c3:#cbbbdc; --c4:#f2c79f; --c5:#acd0c5; --c6:#dfcaa3; --c7:#e4bdd1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1f1c18; --land:#2b2721; --sea:#1b2427; --water:#33464c; --border:#0f0d0b;
    --ink:#eadfc8; --ink-soft:#b3a68f; --panel:rgba(32,29,25,.94); --rule:#4a4237;
    --accent:#e09a7f; --label:#f1e6cf; --halo:rgba(20,18,15,.8);
    --c0:#7d4f4a; --c1:#7d6a3f; --c2:#566a46; --c3:#5d5070; --c4:#82603f; --c5:#3f6a60; --c6:#6c5d42; --c7:#74506a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1f1c18; --land:#2b2721; --sea:#1b2427; --water:#33464c; --border:#0f0d0b;
  --ink:#eadfc8; --ink-soft:#b3a68f; --panel:rgba(32,29,25,.94); --rule:#4a4237;
  --accent:#e09a7f; --label:#f1e6cf; --halo:rgba(20,18,15,.8);
  --c0:#7d4f4a; --c1:#7d6a3f; --c2:#566a46; --c3:#5d5070; --c4:#82603f; --c5:#3f6a60; --c6:#6c5d42; --c7:#74506a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);color:var(--ink);font-family:"EB Garamond",Garamond,"Times New Roman",serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;height:100%;display:flex;flex-direction:column}
#mapbox{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
canvas:active{cursor:grabbing}

#plate{position:absolute;left:16px;top:12px;pointer-events:none;max-width:70%}
#plate h1{margin:0;font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:15px;letter-spacing:.04em;color:var(--ink-soft)}
#year{font-family:"IM Fell English",Georgia,serif;font-size:clamp(40px,8vw,68px);line-height:1;color:var(--ink);margin-top:2px;font-variant-numeric:oldstyle-nums}
#year small{font-size:.42em;letter-spacing:.06em;margin-left:.2em;color:var(--ink-soft)}
#status{font-style:italic;color:var(--ink-soft);font-size:15px;margin-top:4px}

#bar{flex:none;background:var(--panel);border-top:1px solid var(--rule);padding:10px 14px 12px;display:flex;align-items:center;gap:10px}
#bar button{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:transparent;color:var(--ink);font:500 20px/1 "EB Garamond",serif;cursor:pointer;display:grid;place-items:center}
#bar button:hover{border-color:var(--ink-soft)}
#bar button:focus-visible,#slider:focus-visible,#info a:focus-visible,#close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play.on{background:var(--ink);color:var(--paper)}
#track{flex:1;min-width:0;position:relative}
#slider{width:100%;margin:0;accent-color:var(--accent);height:28px}
#ticks{position:relative;height:16px;font-size:12px;color:var(--ink-soft);font-variant-numeric:oldstyle-nums}
#ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
@media (max-width:560px){
  #bar{flex-wrap:wrap;justify-content:center;gap:8px 14px;padding:10px 16px 10px}
  #track{order:-1;flex:1 0 100%}
  #ticks span.minor{display:none}
}

#info{position:absolute;right:14px;top:14px;width:min(300px,calc(100% - 28px));background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:14px 16px 14px;box-shadow:0 6px 24px rgba(40,30,20,.15);display:none}
#info.show{display:block}
#info h2{margin:0 26px 4px 0;font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:24px;line-height:1.15}
#info p{margin:0 0 10px;color:var(--ink-soft);font-size:16px;line-height:1.4}
#info a{color:var(--accent);font-size:16px}
#close{position:absolute;right:8px;top:8px;width:28px;height:28px;border:0;background:transparent;color:var(--ink-soft);font-size:22px;cursor:pointer;line-height:1}
#swatch{display:inline-block;width:12px;height:12px;border:1px solid var(--border);margin-right:6px;vertical-align:-1px}
#credit{position:absolute;right:10px;bottom:6px;font-size:11px;color:var(--ink-soft);font-style:italic;pointer-events:none}
@media (max-width:560px){#info{top:auto;bottom:10px}#credit{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="mapbox">
    <canvas id="map" aria-label="Map of the world's countries in the selected year"></canvas>
    <div id="plate">
      <h1>Worldmapping</h1>
      <div id="year">117<small>CE</small></div>
      <div id="status">Loading borders…</div>
    </div>
    <div id="info" role="dialog" aria-live="polite">
      <button id="close" aria-label="Close">×</button>
      <h2 id="iname"></h2>
      <p id="iyears"></p>
      <a id="iwiki" target="_blank" rel="noopener">Read on Wikipedia</a>
    </div>
    <div id="credit">Borders: Cliopatria (Seshat), CC BY 4.0. Land: Natural Earth. Satellite: NASA Blue Marble. Events: Wikidata.</div>
  </div>
  <div id="bar">
    <button id="prev" aria-label="Previous border change">‹</button>
    <button id="play" aria-label="Play border changes">▶</button>
    <button id="next" aria-label="Next border change">›</button>
    <div id="track">
      <input id="slider" type="range" min="0" max="10000" step="1" aria-label="Year">
      <div id="ticks"></div>
    </div>
  </div>
</div>

<script id="polities" type="application/json">__POLITIES__</script>
<script id="landdata" type="application/json">__LAND__</script>
<script id="relief" type="text/plain">__RELIEF__</script>
<script id="eventdata" type="application/json">__EVENTS__</script>
<script>/* d3 v7.9.0, ISC licence, inlined so the page works offline */
__D3__</script>
<script>
(function(){
const YMIN=-3400, YMAX=2026, POW=2.4;
const yearAt=t=>Math.round(YMAX-(YMAX-YMIN)*Math.pow(1-t,POW));
const tAt=y=>1-Math.pow((YMAX-y)/(YMAX-YMIN),1/POW);
const fmtYear=y=>y<0?[String(-y),'BCE']:[String(Math.max(1,y)),'CE'];
const fmtFull=y=>{const [a,b]=fmtYear(y);return a+' '+b};

const canvas=document.getElementById('map'), ctx=canvas.getContext('2d');
const slider=document.getElementById('slider');
const elYear=document.getElementById('year'), elStatus=document.getElementById('status');
const info=document.getElementById('info');

let W=0,H=0,DPR=1, transform=d3.zoomIdentity;
let projection=d3.geoNaturalEarth1();
let feats=[], names=[], wiki=[], colorIdx=[], span=[], land=null, sphere=null, grat=null;
let active=[], year=117, changeYears=[], playing=null, selected=-1;
let theme={}, first=true, Q=20;

function readTheme(){
  const cs=getComputedStyle(document.documentElement);
  const g=k=>cs.getPropertyValue(k).trim();
  theme={paper:g('--paper'),land:g('--land'),sea:g('--sea'),water:g('--water'),border:g('--border'),label:g('--label'),halo:g('--halo'),accent:g('--accent'),
    pal:[0,1,2,3,4,5,6,7].map(i=>g('--c'+i))};
}

function decode(rings,q){
  return rings.map(r=>{const out=[];let x=0,y=0;for(let i=0;i<r.length;i+=2){x+=r[i];y+=r[i+1];out.push([x/q,y/q])}
    const a=out[0],b=out[out.length-1];if(a[0]!==b[0]||a[1]!==b[1])out.push([a[0],a[1]]);return out});
}
// Borders come as shared arcs: each border line is stored once and every state that
// touches it reuses it (see tools/build_andrew_prototype.py), so neighbours always meet exactly.
// Each arc is smoothed once, so both sides of a border get the very same curve.
let ARCS=[],RINGS=[],AQ=100;const arcCache=[];
const CUT=.12; // longest corner cut in degrees, so long straight borders stay straight
function smoothArc(pts){
  // Chaikin corner cutting, two passes; the ends stay put so arcs still join up at junctions
  for(let pass=0;pass<2;pass++){
    const n=pts.length; if(n<3) return pts;
    const out=[pts[0]];
    for(let i=0;i<n-1;i++){
      const a=pts[i],b=pts[i+1],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);
      if(!len||Math.abs(dx)>180){if(i>0)out.push(a);continue}
      const t=Math.min(.25,CUT/len);
      if(i>0) out.push([a[0]+dx*t,a[1]+dy*t]);
      if(i<n-2) out.push([b[0]-dx*t,b[1]-dy*t]);
    }
    out.push(pts[n-1]); pts=out;
  }
  return pts;
}
function arcPts(i){
  let c=arcCache[i];
  if(!c){
    const r=ARCS[i];c=[];let x=0,y=0;
    for(let j=0;j<r.length;j+=2){x+=r[j];y+=r[j+1];c.push([x/AQ,y/AQ])}
    c=arcCache[i]=smoothArc(c);
  }
  return c;
}
function addArc(out,ref){
  const pts=arcPts(ref<0?~ref:ref),n=pts.length;
  if(ref<0){for(let j=out.length?n-2:n-1;j>=0;j--)out.push(pts[j])}
  else{for(let j=out.length?1:0;j<n;j++)out.push(pts[j])}
}
function ringOf(k){
  const out=[];
  for(const t of RINGS[k]){
    if(Array.isArray(t)){const s=t[0],c=t[1],step=Math.sign(c);for(let j=0;j<Math.abs(c);j++)addArc(out,s+j*step)}
    else addArc(out,t);
  }
  const a=out[0],b=out[out.length-1];
  if(a&&(a[0]!==b[0]||a[1]!==b[1]))out.push(a);
  return out.length>=4?out:null; // a speck smaller than the 1 km grid: skip it
}
// a state's polygons, minus any rings too small to draw
function polysOf(polys){return polys.map(p=>p.map(ringOf)).filter(p=>p[0]).map(p=>p.filter(Boolean))}
/* ---------- names that change over time (fact-checked fixes from the build) ---------- */
let aliasBy=new Map();
function loadAliases(list){aliasBy=new Map();for(const [n,a,b,d] of list||[]){if(!aliasBy.has(n))aliasBy.set(n,[]);aliasBy.get(n).push([a,b,d])}}
function nameAt(n,y){const l=aliasBy.get(n);if(l)for(const [a,b,d] of l)if(a<=y&&y<=b)return d;return names[n]}
const labelName=f=>nameAt(f.n,year);

/* ---------- events: a dot, a line, and the name on the line ---------- */
let EVENTS=[],eventBoxes=[];
function loadEvents(){try{EVENTS=JSON.parse(document.getElementById('eventdata').textContent).events||[]}catch(e){EVENTS=[]}}
const EV_ICON={battle:'⚔',siege:'⚔',war:'⚔',invasion:'⚔',conquest:'⚔',operation:'⚔',treaty:'📜',convention:'📜',congress:'📜',
  revolution:'✊',rebellion:'✊',coup:'✊',protest:'✊',assassination:'🗡',expedition:'🧭',earthquake:'⚠',eruption:'🌋',disaster:'⚠',fire:'🔥',epidemic:'🦠',pandemic:'🦠'};
const EV_KIND={operation:'military operation',war:'war',battle:'battle',siege:'siege',treaty:'treaty',convention:'convention',congress:'congress',revolution:'revolution',rebellion:'uprising',coup:'coup',
  assassination:'assassination',expedition:'expedition',earthquake:'earthquake',eruption:'volcanic eruption',disaster:'disaster',fire:'great fire',epidemic:'epidemic',pandemic:'pandemic',invasion:'invasion',conquest:'conquest',protest:'protest',attack:'attack'};
// The slider moves in bigger steps further back in time, so older events stay up a little longer.
const eventPad=y=>y<-500?25:y<0?10:y<500?6:y<1000?4:y<1500?2:y<1800?1:0;
const eventYears=e=>e.y1>e.y0?fmtFull(e.y0)+' to '+fmtFull(e.y1):fmtFull(e.y0);
function placeEvents(taken){
  const k=transform.k,ts=theme.ts||1,pad=eventPad(year),out=[],boxes=[...taken];
  const vis=EVENTS.filter(e=>e.y0-pad<=year&&year<=e.y1+pad&&(e.tier===2||k>=1.3)).sort((a,b)=>b.tier-a.tier||b.sl-a.sl);
  const maxN=Math.round(Math.min(11,3+W*H/90000));
  ctx.save(); ctx.setTransform(DPR,0,0,DPR,0,0);
  const hit=b=>boxes.some(o=>!(b[2]<o[0]||b[0]>o[2]||b[3]<o[1]||b[1]>o[3]));
  for(const e of vis){
    if(out.length>=maxN) break;
    const [x,y]=screenAt([e.lon,e.lat]); if(x<6||y<6||x>W-6||y>H-6) continue;
    if(hit([x-4,y-4,x+4,y+4])) continue; // its dot would sit under another label
    const size=(e.tier===2?15:13)*ts;
    ctx.font=`${e.tier===2?600:500} ${size}px "EB Garamond", Garamond, serif`;
    const txt=(EV_ICON[e.kind]||'◆')+' '+e.name, w=ctx.measureText(txt).width+8;
    let best=null;
    for(const len of [30,48,70,96]) for(const [dx,dy] of [[1,-1],[-1,-1],[1,1],[-1,1]]){
      const ex=x+dx*len*.75, ey=y+dy*len*.65, hx=ex+dx*w;
      const box=[Math.min(ex,hx),ey-size-3,Math.max(ex,hx),ey+3];
      if(box[0]<4||box[2]>W-4||box[1]<4||box[3]>H-4) continue;
      if(hit(box)) continue;
      // the leader line mustn't run through another label either
      let crosses=false;
      for(let i=1;i<6&&!crosses;i++){const t=i/6,px=x+(ex-x)*t,py=y+(ey-y)*t;if(hit([px-1,py-1,px+1,py+1]))crosses=true}
      if(crosses) continue;
      best={e,x,y,ex,ey,hx,dx,txt,size,box}; break;
    }
    if(!best) continue;
    out.push(best); boxes.push(best.box,[x-5,y-5,x+5,y+5]);
    for(let i=1;i<6;i++){const t=i/6,px=x+(best.ex-x)*t,py=y+(best.ey-y)*t;boxes.push([px-2,py-2,px+2,py+2])} // keep later labels off this line
  }
  ctx.restore(); return out;
}
function drawEvents(list){
  ctx.save(); ctx.setTransform(DPR,0,0,DPR,0,0); ctx.lineJoin='round'; ctx.lineCap='round';
  for(const p of list){
    const strokeLine=()=>{ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.ex,p.ey);ctx.lineTo(p.hx,p.ey);ctx.stroke()};
    ctx.strokeStyle=theme.halo; ctx.lineWidth=3.5; strokeLine();
    ctx.strokeStyle=theme.accent; ctx.lineWidth=p.e.tier===2?1.6:1.1; strokeLine();
    ctx.beginPath(); ctx.arc(p.x,p.y,p.e.tier===2?4.5:3.5,0,Math.PI*2);
    ctx.fillStyle=theme.accent; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle=theme.halo; ctx.stroke();
    ctx.font=`${p.e.tier===2?600:500} ${p.size}px "EB Garamond", Garamond, serif`;
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    const tx=Math.min(p.ex,p.hx)+4, ty=p.ey-4;
    ctx.lineWidth=3; ctx.strokeStyle=theme.halo; ctx.strokeText(p.txt,tx,ty);
    ctx.fillStyle=theme.label; ctx.fillText(p.txt,tx,ty);
  }
  ctx.restore();
  eventBoxes=list.map(p=>({e:p.e,x:p.x,y:p.y,box:[p.box[0]-2,p.box[1]-3,p.box[2]+2,p.box[3]+4]}));
}
function eventAt(cx,cy){
  for(const b of eventBoxes) if((cx>=b.box[0]&&cx<=b.box[2]&&cy>=b.box[1]&&cy<=b.box[3])||Math.hypot(cx-b.x,cy-b.y)<10) return b.e;
  return null;
}

/* ---------- land detail: relief, lakes, rivers, terrain names ---------- */
let lakes=null,coast=null,rivers=[],terrain=[],lakesPath=null,coastPath=null,riverPaths=[],reliefImg=null;
function decodeLine(r,q){const out=[];let x=0,y=0;for(let i=0;i<r.length;i+=2){x+=r[i];y+=r[i+1];out.push([x/q,y/q])}return out}
function loadLayers(L){
  const q=n=>typeof L.q==='object'?L.q[n]:L.q; // each layer has its own grid
  land=fixWinding({type:'MultiPolygon',coordinates:L.land.map(p=>decode(p,q('land')))});
  lakes=fixWinding({type:'MultiPolygon',coordinates:L.lakes.map(p=>decode(p,q('lakes')))});
  coast=fixWinding({type:'MultiPolygon',coordinates:L.coast.map(p=>decode(p,q('coast')))});
  rivers=L.rivers.map(([r,l])=>({r,g:{type:'LineString',coordinates:decodeLine(l,q('rivers'))}}));
  terrain=L.terrain.map(([name,kind,rank,lon,lat,wd])=>({name,kind,rank,ll:[lon,lat],wd}));
  const src=(document.getElementById('relief')||{}).textContent||'';
  if(src.startsWith('data:image')){reliefImg=new Image();reliefImg.onload=()=>{if(typeof redraw==='function')redraw();else draw()};reliefImg.src=src.trim()}
}
function buildLayers(){
  lakesPath=new Path2D(); d3.geoPath(projection,lakesPath)(lakes);
  coastPath=new Path2D(); d3.geoPath(projection,coastPath)(coast);
  riverPaths=[new Path2D(),new Path2D(),new Path2D()];
  for(const r of rivers) d3.geoPath(projection,riverPaths[r.r<=2?0:r.r<=4?1:2])(r.g);
}
// Shaded relief. Natural Earth projection keeps each line of latitude straight, so every
// screen row is one stretched row of the plain lat/long relief image: a cheap exact reprojection.
// The view-sized layer is cached and only redrawn once the map settles; while it moves,
// the cached layer is shifted and scaled to follow.
const rl={key:'',cv:null,pending:'',since:0,t:0,T:null};
function viewKey(){return [W,H,DPR,transform.x.toFixed(1),transform.y.toFixed(1),transform.k.toFixed(4)].join('|')}
function settled(cache,key){
  if(cache.key===key) return true;
  const now=performance.now();
  if(cache.pending!==key){cache.pending=key;cache.since=now}
  if(!cache.cv||now-cache.since>=160) return false; // time to (re)draw it
  clearTimeout(cache.t); cache.t=setTimeout(redrawSoon,200); return null; // still moving: reuse the old one
}
function drawCached(cache,op,alpha){
  const T=cache.T,s=transform.k/T.k;
  ctx.save(); ctx.globalCompositeOperation=op; ctx.globalAlpha=alpha;
  ctx.setTransform(DPR*s,0,0,DPR*s,DPR*(transform.x-T.x*s),DPR*(transform.y-T.y*s));
  ctx.drawImage(cache.cv,0,0,W,H); ctx.restore();
}
function drawRelief(){
  const img=reliefImg; if(!img||!img.complete||!img.naturalWidth) return;
  const key=viewKey();
  if(settled(rl,key)===false){
    const k=transform.k,iw=img.naturalWidth,ih=img.naturalHeight,cx=projection([0,0])[0];
    const cv=rl.cv||document.createElement('canvas'); cv.width=canvas.width; cv.height=canvas.height;
    const c=cv.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0); c.imageSmoothingEnabled=true;
    for(let y=0;y<H;y++){
      const inv=projection.invert([cx,(y+.5-transform.y)/k]); if(!inv) continue;
      const phi=inv[1]; if(!(phi>-90&&phi<90)) continue;
      const x0=transform.x+projection([-180,phi])[0]*k, x1=transform.x+projection([180,phi])[0]*k, span=x1-x0;
      const xa=Math.max(0,x0), xb=Math.min(W,x1); if(xb<=xa||span<=0) continue;
      c.drawImage(img,(xa-x0)/span*iw,(90-phi)/180*ih,(xb-xa)/span*iw,1,xa,y,xb-xa,1);
    }
    rl.cv=cv; rl.key=key; rl.T={x:transform.x,y:transform.y,k:transform.k};
  }
  if(rl.cv) drawCached(rl,'overlay',.6);
}
function drawWater(k){
  ctx.fillStyle=theme.sea; ctx.fill(lakesPath);
  ctx.strokeStyle=theme.water; ctx.lineWidth=.6/k; ctx.stroke(lakesPath);
  ctx.strokeStyle=theme.water; ctx.lineJoin='round'; ctx.lineCap='round';
  const widths=[1.3,.9,.6], minK=[1,2,4];
  for(let i=0;i<3;i++) if(k>=minK[i]){ctx.globalAlpha=.9;ctx.lineWidth=widths[i]/k;ctx.stroke(riverPaths[i])}
  ctx.globalAlpha=1; ctx.lineCap='butt';
}
function drawTerrain(placed){
  const k=transform.k, ts=theme.ts||1;
  ctx.save(); ctx.globalAlpha=.6;
  for(const t of terrain){
    const ke=k*Math.min(1,W/1000); // how big the map really is on this screen
    if(t.rank>(ke<.8?0:ke<2.2?1:ke<4?2:ke<8?3:9)) continue;
    const [x,y]=screenAt(t.ll); if(x<-80||y<-20||x>W+80||y>H+20) continue;
    const size=Math.max(10,Math.min(14,11.5-t.rank*.5+Math.log2(k)))*ts;
    ctx.font=`italic 400 ${size}px "EB Garamond", Garamond, serif`;
    if('letterSpacing' in ctx) ctx.letterSpacing=(size*(t.kind==='mtn'?.28:.14)).toFixed(1)+'px';

    // open on the Roman world: frame the Old World from the Atlantic to China
    const a=projection([-12,58]), b=projection([125,8]);
    const k=Math.max(1,Math.min(W/(b[0]-a[0]),(H-140)/(b[1]-a[1]))*0.95);
    if(k>1.15){
      const cx=(a[0]+b[0])/2, cy=(a[1]+b[1])/2;
      d3.select(canvas).call(zoom.transform,d3.zoomIdentity.translate(W/2-cx*k,H/2+30-cy*k).scale(k));
    }
  }
  draw();
}

function setActive(){
  const before=new Set(active);
  active=feats.filter(f=>f.a<=year&&year<=f.b);
  active.forEach(pathOf);
  active.sort((x,y)=>y.area-x.area);
  refitNear(before);
}

function draw(){
  if(!landPath) return;
  const k=transform.k;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=theme.paper; ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*k,0,0,DPR*k,DPR*transform.x,DPR*transform.y);
  // sea
  ctx.fillStyle=theme.sea; ctx.fill(spherePath);
  ctx.save(); ctx.clip(spherePath);
  ctx.strokeStyle=theme.water; ctx.globalAlpha=.35; ctx.lineWidth=.5/k; ctx.stroke(gratPath); ctx.globalAlpha=1;
  ctx.restore();
  drawWaterlines(k);
  ctx.fillStyle=theme.land; ctx.fill(landPath);
  // states, clipped to land so ragged simplified edges stay on shore
  ctx.save(); ctx.clip(landPath);
  const satel=drawSatellite(); // real terrain under see-through country colours
  for(const f of active){
    ctx.fillStyle=theme.pal[colorIdx[f.n]%8];
    ctx.globalAlpha=satel?(f.n===selected?.62:.42):(f.n===selected?1:.92);
    ctx.fill(f.path,'nonzero');
  }
  ctx.globalAlpha=1; if(!satel) drawRelief(); drawWater(k);
  ctx.globalAlpha=1; ctx.strokeStyle=theme.border; ctx.lineWidth=.6/k; ctx.lineJoin='round';
  for(const f of active) ctx.stroke(f.path);
  if(selected>=0){ctx.strokeStyle=theme.accent;ctx.lineWidth=2/k;for(const f of active) if(f.n===selected) ctx.stroke(f.path)}
  ctx.restore();
  // coastline
  ctx.strokeStyle=theme.border; ctx.globalAlpha=.7; ctx.lineWidth=.55/k; ctx.stroke(landPath); ctx.globalAlpha=1;
  ctx.strokeStyle=theme.water; ctx.lineWidth=1/k; ctx.stroke(spherePath);
  if(satel) topFade(); // keeps the year readable over bright ice and desert
  drawLabels();
}

function drawLabels(){
  const placed=drawStateLabels(f=>labelName(f));
  const ev=placeEvents(placed);
  for(const p of ev) placed.push(p.box);
  drawTerrain(placed); drawEvents(ev);
}

let raf=0; const redraw=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})};

function setYear(y,fromSlider){
  year=Math.max(YMIN,Math.min(YMAX,y));
  const [a,b]=fmtYear(year); elYear.innerHTML=a+'<small>'+b+'</small>';
  if(!fromSlider) slider.value=Math.round(tAt(year)*10000);
  slider.setAttribute('aria-valuetext',fmtFull(year));
  setActive();
  {const n=new Set(active.map(f=>f.n)).size;elStatus.textContent=n+(n===1?' country':' countries')+' on the map'}
  if(selected>=0&&!active.some(f=>f.n===selected)) hideInfo();
  redraw();
}

function step(dir){
  let y;
  if(dir>0) y=changeYears.find(c=>c>year);
  else {for(let i=changeYears.length-1;i>=0;i--) if(changeYears[i]<year){y=changeYears[i];break}}
  if(y!==undefined) setYear(y); else if(dir>0) stopPlay();
}
function stopPlay(){clearInterval(playing);playing=null;const b=document.getElementById('play');b.classList.remove('on');b.textContent='▶';b.setAttribute('aria-label','Play border changes')}
function togglePlay(){
  if(playing){stopPlay();return}
  if(year>=YMAX) setYear(YMIN);
  const b=document.getElementById('play'); b.classList.add('on'); b.textContent='❚❚'; b.setAttribute('aria-label','Pause');
  playing=setInterval(()=>step(1),650);
}

function showInfo(n){
  selected=n;
  document.getElementById('iname').textContent=nameAt(n,year);
  const s=span[n];
  document.getElementById('iyears').innerHTML='<span id="swatch" style="background:'+theme.pal[colorIdx[n]%8]+'"></span>On the map '+fmtFull(s[0])+' to '+fmtFull(s[1]);
  const a=document.getElementById('iwiki');
  if(wiki[n]){a.style.display='';a.href='https://en.wikipedia.org/wiki/'+encodeURIComponent(wiki[n].replace(/ /g,'_'))}else a.style.display='none';
  info.classList.add('show'); redraw();
}
function showEvent(ev){
  selected=-1;
  document.getElementById('iname').textContent=(EV_ICON[ev.kind]||'◆')+' '+ev.name;
  const kind=EV_KIND[ev.kind]||'event';
  document.getElementById('iyears').textContent=eventYears(ev)+' · '+(ev.desc||kind);
  const a=document.getElementById('iwiki'); a.style.display=''; a.href='https://en.wikipedia.org/wiki/'+ev.wiki;
  info.classList.add('show'); redraw();
}
function hideInfo(){selected=-1;info.classList.remove('show');redraw()}

canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const ev=eventAt(e.clientX-r.left,e.clientY-r.top);
  if(ev){showEvent(ev);return}
  const [px,py]=transform.invert([e.clientX-r.left,e.clientY-r.top]);
  ctx.setTransform(1,0,0,1,0,0);
  let hit=-1;
  for(let i=active.length-1;i>=0;i--){ if(ctx.isPointInPath(active[i].path,px,py,'nonzero')){hit=active[i].n;break} }
  if(hit>=0) showInfo(hit); else hideInfo();
});
// test hook for headless checks
window.Worldmapping={get active(){return active},get year(){return year},names,nameAt,setYear:y=>{stopPlay();setYear(y)},draw,get transform(){return transform},
  view:(ll,k)=>{const p=projection(ll);d3.select(canvas).call(zoom.transform,d3.zoomIdentity.translate(W/2-p[0]*k,H/2-p[1]*k).scale(k))},
  get events(){return eventBoxes.map(b=>b.e.name)}};
document.getElementById('close').onclick=hideInfo;
document.getElementById('prev').onclick=()=>{stopPlay();step(-1)};
document.getElementById('next').onclick=()=>{stopPlay();step(1)};
document.getElementById('play').onclick=togglePlay;
slider.addEventListener('input',()=>{stopPlay();setYear(yearAt(slider.value/10000),true)});
document.addEventListener('keydown',e=>{
  if(e.target===slider) return;
  if(e.key==='ArrowRight'){stopPlay();step(1)} else if(e.key==='ArrowLeft'){stopPlay();step(-1)} else if(e.key==='Escape') hideInfo();
});

const zoom=d3.zoom().scaleExtent([1,40]).on('zoom',e=>{transform=e.transform;redraw()});
d3.select(canvas).call(zoom).on('dblclick.zoom',null);

function ticks(){
  const el=document.getElementById('ticks'); el.innerHTML='';
  [[-3000,'3000 BCE',0],[-1000,'1000 BCE',1],[1,'1 CE',0],[1000,'1000',1],[1500,'1500',0],[1900,'1900',1]].forEach(([y,l,m])=>{
    const s=document.createElement('span'); s.style.left=(tAt(y)*100)+'%'; s.textContent=l; if(m)s.className='minor'; el.appendChild(s);
  });
}

const mq=window.matchMedia('(prefers-color-scheme: dark)');
mq.addEventListener&&mq.addEventListener('change',()=>{readTheme();redraw()});

readTheme();
setTimeout(()=>{
  load(); ticks();
  window.addEventListener('resize',resize);
  resize();
  setYear(117); draw();
  if(document.fonts&&document.fonts.load) document.fonts.load('500 14px "EB Garamond"').then(redraw).catch(()=>{});
},30);
})();
</script>
